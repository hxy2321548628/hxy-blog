# 容器由无特权用户运行，PID 和临时文件必须放在可写的 /tmp。
# 该 Nginx 同时承担三项职责：静态文件、React SPA 路由回退、/api 反向代理。
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # 个人博客单实例不需要大量 worker；512 个连接足够 MVP，并控制内存占用。
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    # sendfile 让内核直接发送静态文件；keepalive 减少重复 TCP 连接成本。
    sendfile on;
    keepalive_timeout 65;

    # 根文件系统只读，因此 Nginx 所有可能写入的临时目录都必须指向 tmpfs。
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 容器健康检查不依赖 API，便于区分 Web 与后端故障。
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # 保留完整 /api 路径转发给 Go 服务。
        location /api/ {
            # 文件本体上限为 10 MiB；额外 1 MiB 只为 multipart 边界和字段开销。
            client_max_body_size 11m;
            client_body_timeout 45s;
            # proxy_pass 不带尾部路径，Nginx 会原样保留 /api/...。
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            # 上传体直接转发给 API，避免 Web 容器再把整张图片缓冲到 /tmp。
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # X-Forwarded-* 让 Go API 在受信代理边界内获得原始客户端信息。
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            # API 上传上下文为 35 秒，代理需留出返回结构化错误的余量。
            proxy_send_timeout 45s;
            proxy_read_timeout 45s;
        }

        # 带内容哈希的 Vite 资源可以长期缓存。
        location /assets/ {
            # 文件名包含内容哈希，内容变化会生成新 URL，因此可以安全缓存一年。
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # React Router 的未知页面路径统一回退到 SPA 入口。
        location / {
            # 先查真实文件；不存在时返回 index.html，由 React Router 解释浏览器路径。
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
