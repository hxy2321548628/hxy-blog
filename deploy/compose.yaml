name: hxy-blog

# 本文件服务本地开发和 CI：可以从当前源码 build，也允许通过环境变量复用已有镜像。
# ${VAR:-default} 表示变量为空时使用默认值；${VAR:?message} 表示缺失时立即报错。
services:
  mysql:
    # 复用腾讯云服务器现有镜像，并固定为已盘点的不可变 Digest。
    image: ${MYSQL_IMAGE:-mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    command:
      # 显式固定字符集、排序规则和资源上限，使本地行为接近 2C2G 生产环境。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=268435456
      - --max-connections=50
    environment:
      # 应用用户用于日常连接；root 只用于健康检查、迁移测试和备份操作。
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hxy_blog}
      MYSQL_USER: ${MYSQL_USER:-hxy_blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 只绑定回环地址，供本机开发使用，不向公网暴露数据库。
      - 127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306
    volumes:
      # 命名卷独立于容器生命周期，重新创建 MySQL 容器不会丢失开发数据。
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ 会把 $ 留给容器内 Shell 展开，避免 Compose 在宿主机提前替换密码。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

  api:
    # API_IMAGE 可直接指定已构建镜像；没有指定时按下面的 build 配置生成本地镜像。
    image: ${API_IMAGE:-hxy-blog-api:local}
    build:
      context: ../src/backend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
        # 仅在 Docker 构建阶段使用，便于开发机选择可达的 Go 模块镜像源。
        GO_MODULE_PROXY: ${GO_MODULE_PROXY:-https://proxy.golang.org,direct}
    environment:
      HTTP_ADDR: :8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hxy_blog}
      MYSQL_USER: ${MYSQL_USER:-hxy_blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # 开发默认值仅服务回环地址；生产 Compose 不允许回退到示例签名密钥。
      AUTH_JWT_CURRENT_KEY_ID: ${AUTH_JWT_CURRENT_KEY_ID:-local-development}
      AUTH_JWT_CURRENT_KEY: ${AUTH_JWT_CURRENT_KEY:-local-development-only-key-change-me-1234567890}
      AUTH_JWT_PREVIOUS_KEY_ID: ${AUTH_JWT_PREVIOUS_KEY_ID:-}
      AUTH_JWT_PREVIOUS_KEY: ${AUTH_JWT_PREVIOUS_KEY:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8080,http://localhost:8080}
      AUTH_SECURE_COOKIE: ${AUTH_SECURE_COOKIE:-false}
      # 四项全部为空时仅禁用上传，方便没有测试桶凭据的本地阅读开发。
      MEDIA_COS_BUCKET_URL: ${MEDIA_COS_BUCKET_URL:-}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_COS_SECRET_ID: ${MEDIA_COS_SECRET_ID:-}
      MEDIA_COS_SECRET_KEY: ${MEDIA_COS_SECRET_KEY:-}
    depends_on:
      # 仅按启动顺序不够；service_healthy 确保 API 启动前 MySQL 已可接受连接。
      mysql:
        condition: service_healthy
    expose:
      # expose 只在 Compose 网络中声明端口，不把 API 直接发布到宿主机。
      - "8080"
    # 运行时根文件系统只读，临时文件只能写入内存中的 /tmp。
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 15s

  web:
    image: ${WEB_IMAGE:-hxy-blog-web:local}
    build:
      context: ../src/web
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
    depends_on:
      # Web 的 Nginx 会反向代理 /api，因此等待 API 健康后再启动。
      api:
        condition: service_healthy
    ports:
      # 备案完成并增加 TLS 入口前，仅允许服务器本机访问。
      - 127.0.0.1:${WEB_BIND_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 128m

volumes:
  # 只声明卷名；实际位置和生命周期由 Docker 管理。
  mysql_data:
