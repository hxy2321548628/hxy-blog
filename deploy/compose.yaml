name: hxy-blog

services:
  mysql:
    # 复用腾讯云服务器现有镜像，并固定为已盘点的不可变 Digest。
    image: ${MYSQL_IMAGE:-mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=268435456
      - --max-connections=50
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hxy_blog}
      MYSQL_USER: ${MYSQL_USER:-hxy_blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 只绑定回环地址，供本机开发使用，不向公网暴露数据库。
      - 127.0.0.1:${MYSQL_BIND_PORT:-3306}:3306
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

  api:
    image: ${API_IMAGE:-hxy-blog-api:local}
    build:
      context: ../src/backend
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
    environment:
      HTTP_ADDR: :8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hxy_blog}
      MYSQL_USER: ${MYSQL_USER:-hxy_blog}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 256m
    stop_grace_period: 15s

  web:
    image: ${WEB_IMAGE:-hxy-blog-web:local}
    build:
      context: ../src/web
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-dev}
        REVISION: ${APP_REVISION:-local}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 备案完成并增加 TLS 入口前，仅允许服务器本机访问。
      - 127.0.0.1:${WEB_BIND_PORT:-8080}:8080
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 128m

volumes:
  mysql_data:
