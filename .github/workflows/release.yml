name: Release

# 流程概览：main 的 CI 成功 → Task 构建并推送两个 GHCR 镜像 → 记录不可变 Digest
# → 等待 production Environment 人工批准 → 通过受限 SSH 命令让服务器按 Digest 部署。
on:
  # 只有 main 的 CI 完成后才考虑发布，避免 Release 与 CI 并发竞速。
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# 同一时间只允许一个镜像发布；旧发布不强制取消，避免留下半套镜像。
concurrency:
  group: release-main
  cancel-in-progress: false

# 默认只读；只有 publish Job 可以写入 Packages。
permissions:
  contents: read

jobs:
  publish:
    # 只接受由 main push 触发且成功的 CI，不处理手工或 PR 运行。
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      # deploy Job 只接收仓库返回的内容 Digest，不依赖可移动的 main 标签。
      api_digest: ${{ steps.digests.outputs.api_digest }}
      web_digest: ${{ steps.digests.outputs.web_digest }}
    env:
      # 镜像仓库和触发 CI 的 Commit 在整个 Job 内保持一致。
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/hxy-blog-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/hxy-blog-web
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      RELEASE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # 必须检出通过 CI 的精确提交，不能隐式使用此时的 main HEAD。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # 发布逻辑与本地 Task 入口一致；只安装工具，不在生产主机执行构建。
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1

      - name: 登录 GHCR
        env:
          # GITHUB_TOKEN 是 GitHub 为本次 Job 临时签发的短期令牌，不是长期 PAT。
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      # 一次调用完成构建、发布和 Digest 记录，作业输出供部署复用。
      - name: 发布已验证提交的镜像
        id: digests
        run: task release:publish

  deploy:
    name: 部署到腾讯云生产环境
    needs: publish
    runs-on: ubuntu-latest
    # 生产机跨境拉取 GHCR 镜像可能超过 10 分钟，保留有界的部署窗口。
    timeout-minutes: 60
    permissions:
      contents: read
    environment:
      # Environment 同时提供人工批准门禁、受保护分支限制和生产 Secrets。
      name: production
    env:
      DEPLOY_ENV: production
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      API_DIGEST: ${{ needs.publish.outputs.api_digest }}
      WEB_DIGEST: ${{ needs.publish.outputs.web_digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      # 密钥只传给这一步；Task 校验环境、Commit 和 Digest 后调用受限 SSH 入口。
      - name: 调用服务器固定部署入口
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: task release:deploy
