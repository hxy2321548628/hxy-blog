name: CI

# 流程概览：Task 安装依赖与检查 → 构建镜像 → 真实 MySQL 迁移 → 容器冒烟。
# 构建和测试逻辑在 Taskfile 与脚本中，本文件仅保留触发、权限和任务编排。
on:
  # 所有合并到 main 的变更都必须先通过这条 PR 门禁。
  pull_request:
    branches: [main]
  # 合并后再检查一次 main，及时发现合并结果导致的问题。
  push:
    branches: [main]

# 同一分支有新提交时取消旧任务，节省 Actions 时长。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 只需读取仓库内容，避免给予不必要的写权限。
permissions:
  contents: read

jobs:
  # main 分支保护引用了 check 这个名称，修改时需同步更新远程规则。
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # checkout 获取触发本次工作流的精确提交。PR 运行时是 GitHub 生成的合并测试提交。
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Go 版本从 go.mod 读取，避免工作流和源码分别维护版本号。
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version-file: src/backend/go.mod
          cache: true
      # Node 版本与前端构建镜像保持同一主版本，并以 lockfile 作为缓存键。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      # Task 与 Taskfile 使用同一固定版本；安装只影响 Runner，不进入生产镜像。
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      - run: task install
      - run: task check
      # Dockerfile 也是交付代码，PR 必须证明两个生产镜像都能构建。
      - run: task container-build
      # 两个脚本在退出时清理隔离卷；任一步失败都会让 check 失败。
      - name: 验证 Goose up、幂等执行和 down
        run: task ci:migration
      - name: 验证容器健康检查、API 代理和 SPA 回退
        run: task ci:smoke
