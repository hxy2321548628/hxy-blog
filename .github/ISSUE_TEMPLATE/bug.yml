name: Bug
description: 报告可重现的缺陷
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: current
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 去除密钥和个人信息后的日志、截图或环境信息。
